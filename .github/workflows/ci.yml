name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test

  collector:
    # the collector supports Python 3.9+; runner images no longer ship 3.9, so use the official image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: python:3.9-slim
    steps:
      - uses: actions/checkout@v4
      - name: Collector tests (Python 3.9)
        run: python3 -m unittest discover -s collector/tests -t collector
